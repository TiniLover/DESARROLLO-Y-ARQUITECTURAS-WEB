<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario La Mañana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        /* header */
        header {
            background-color: #1a1a2e;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 13px;
            color: #aaa;
        }

        nav {
            background-color: #e63946;
            padding: 8px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* contenido principal */
        .contenedor {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .titulo-formulario {
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .formulario {
            background-color: white;
            padding: 25px;
            border: 1px solid #ccc;
        }

        /* grilla de 2 columnas */
        .grilla {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grilla {
                grid-template-columns: 1fr;
            }
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .campo input {
            padding: 8px;
            border: 1px solid #aaa;
            font-size: 14px;
        }

        .campo input:focus {
            outline: none;
            border-color: #1a1a2e;
        }

        .campo input.error {
            border-color: red;
        }

        .campo input.ok {
            border-color: green;
        }

        .mensaje-error {
            color: red;
            font-size: 12px;
            margin-top: 3px;
            min-height: 16px;
        }

        /* boton enviar */
        .fila-boton {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 10px;
        }

        .fila-boton button {
            background-color: #1a1a2e;
            color: white;
            border: none;
            padding: 10px 40px;
            font-size: 15px;
            cursor: pointer;
        }

        .fila-boton button:hover {
            background-color: #e63946;
        }

        /* modal */
        .modal-fondo {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-fondo.abierto {
            display: flex;
        }

        .modal-caja {
            background: white;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border-top: 4px solid #e63946;
        }

        .modal-caja h2 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .modal-caja h2.exito { color: green; }
        .modal-caja h2.fallo { color: red; }

        .dato-fila {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .dato-fila span:first-child {
            font-weight: bold;
            color: #555;
        }

        .lista-errores {
            list-style: none;
            font-size: 14px;
        }

        .lista-errores li {
            color: red;
            padding: 4px 0;
            border-bottom: 1px solid #fdd;
        }

        .lista-errores li::before {
            content: "✗ ";
        }

        .modal-caja button {
            margin-top: 15px;
            background-color: #1a1a2e;
            color: white;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 14px;
        }

        /* footer */
        footer {
            background-color: #1a1a2e;
            color: #aaa;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <h1>Diario La Mañana</h1>
    <p>Tu fuente de noticias todos los días</p>
</header>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Política</a>
    <a href="#">Economía</a>
    <a href="#">Deportes</a>
    <a href="#">Cultura</a>
    <a href="#">Tecnología</a>
</nav>

<div class="contenedor">

    <div class="titulo-formulario" id="titulo">SUSCRIBITE</div>

    <div class="formulario">
        <form id="miFormulario" novalidate>
            <div class="grilla">

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Juan Pérez">
                    <span class="mensaje-error" id="err-nombre"></span>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="text" id="email" placeholder="juan@mail.com">
                    <span class="mensaje-error" id="err-email"></span>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                    <span class="mensaje-error" id="err-password"></span>
                </div>

                <div class="campo">
                    <label for="password2">Repetir contraseña</label>
                    <input type="password" id="password2" placeholder="Repetí tu contraseña">
                    <span class="mensaje-error" id="err-password2"></span>
                </div>

                <div class="campo">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" placeholder="Ej: 25">
                    <span class="mensaje-error" id="err-edad"></span>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" placeholder="Ej: 1145678901">
                    <span class="mensaje-error" id="err-telefono"></span>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" placeholder="Ej: Corrientes 1234">
                    <span class="mensaje-error" id="err-direccion"></span>
                </div>

                <div class="campo">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" placeholder="Ej: Buenos Aires">
                    <span class="mensaje-error" id="err-ciudad"></span>
                </div>

                <div class="campo">
                    <label for="cp">Código postal</label>
                    <input type="text" id="cp" placeholder="Ej: 1414">
                    <span class="mensaje-error" id="err-cp"></span>
                </div>

                <div class="campo">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" placeholder="Ej: 30123456">
                    <span class="mensaje-error" id="err-dni"></span>
                </div>

                <div class="fila-boton">
                    <button type="submit">Enviar</button>
                </div>

            </div>
        </form>
    </div>

</div>

<!-- Modal -->
<div class="modal-fondo" id="modalFondo">
    <div class="modal-caja" id="modalCaja">
    </div>
</div>

<footer>
    <p>© 2025 Diario La Mañana - Todos los derechos reservados</p>
</footer>

<script>

    // validaciones
    function validarNombre(v) {
        if (v.trim().length <= 6) return 'El nombre debe tener más de 6 caracteres.';
        if (!/\S+\s+\S+/.test(v.trim())) return 'Debe tener al menos un espacio entre palabras.';
        return null;
    }

    function validarEmail(v) {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'El email no tiene un formato válido.';
        return null;
    }

    function validarPassword(v) {
        if (v.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
        if (!/[a-zA-Z]/.test(v)) return 'Debe contener letras.';
        if (!/[0-9]/.test(v)) return 'Debe contener números.';
        return null;
    }

    function validarPassword2(v) {
        var p1 = document.getElementById('password').value;
        if (!v) return 'Este campo no puede estar vacío.';
        if (v !== p1) return 'Las contraseñas no coinciden.';
        return null;
    }

    function validarEdad(v) {
        var n = parseInt(v);
        if (isNaN(n)) return 'Ingresá un número entero.';
        if (n < 18) return 'Tenés que ser mayor de 18 años.';
        return null;
    }

    function validarTelefono(v) {
        if (/[\s\-()]/.test(v)) return 'No uses espacios, guiones ni paréntesis.';
        if (!/^\d{7,}$/.test(v)) return 'Debe tener al menos 7 dígitos numéricos.';
        return null;
    }

    function validarDireccion(v) {
        if (v.trim().length < 5) return 'La dirección debe tener al menos 5 caracteres.';
        if (!/[a-zA-Z0-9]+\s+[a-zA-Z0-9]+/.test(v)) return 'Debe tener letras, números y un espacio.';
        return null;
    }

    function validarCiudad(v) {
        if (v.trim().length < 3) return 'La ciudad debe tener al menos 3 caracteres.';
        return null;
    }

    function validarCp(v) {
        if (v.trim().length < 3) return 'El código postal debe tener al menos 3 caracteres.';
        return null;
    }

    function validarDni(v) {
        if (!/^\d{7,8}$/.test(v.trim())) return 'El DNI debe tener 7 u 8 dígitos.';
        return null;
    }

    // mapeo de campos con su funcion de validacion
    var campos = {
        nombre:    validarNombre,
        email:     validarEmail,
        password:  validarPassword,
        password2: validarPassword2,
        edad:      validarEdad,
        telefono:  validarTelefono,
        direccion: validarDireccion,
        ciudad:    validarCiudad,
        cp:        validarCp,
        dni:       validarDni
    };

    var labels = {
        nombre:    'Nombre completo',
        email:     'Email',
        password:  'Contraseña',
        password2: 'Repetir contraseña',
        edad:      'Edad',
        telefono:  'Teléfono',
        direccion: 'Dirección',
        ciudad:    'Ciudad',
        cp:        'Código postal',
        dni:       'DNI'
    };

    function mostrarError(id, msg) {
        var input = document.getElementById(id);
        var span = document.getElementById('err-' + id);
        span.textContent = msg || '';
        if (msg) {
            input.classList.add('error');
            input.classList.remove('ok');
        } else {
            input.classList.remove('error');
            input.classList.add('ok');
        }
    }

    function limpiarError(id) {
        var input = document.getElementById(id);
        var span = document.getElementById('err-' + id);
        span.textContent = '';
        input.classList.remove('error');
    }

    // eventos blur y focus para cada campo
    Object.keys(campos).forEach(function(id) {
        var input = document.getElementById(id);

        input.addEventListener('blur', function() {
            var error = campos[id](input.value);
            mostrarError(id, error);
        });

        input.addEventListener('focus', function() {
            limpiarError(id);
        });
    });

    // bonus: titulo dinamico
    var inputNombre = document.getElementById('nombre');
    var titulo = document.getElementById('titulo');

    inputNombre.addEventListener('keydown', function() {
        setTimeout(function() {
            var val = inputNombre.value.trim();
            if (val != '') {
                titulo.textContent = 'HOLA ' + val.toUpperCase();
            } else {
                titulo.textContent = 'SUSCRIBITE';
            }
        }, 0);
    });

    inputNombre.addEventListener('focus', function() {
        var val = inputNombre.value.trim();
        if (val != '') {
            titulo.textContent = 'HOLA ' + val.toUpperCase();
        }
    });

    // submit
    document.getElementById('miFormulario').addEventListener('submit', function(e) {
        e.preventDefault();

        var errores = [];

        Object.keys(campos).forEach(function(id) {
            var input = document.getElementById(id);
            var error = campos[id](input.value);
            mostrarError(id, error);
            if (error) {
                errores.push(labels[id] + ': ' + error);
            }
        });

        abrirModal(errores);
    });

    function abrirModal(errores) {
        var caja = document.getElementById('modalCaja');
        var fondo = document.getElementById('modalFondo');

        if (errores.length == 0) {
            var html = '<h2 class="exito">¡Suscripción exitosa!</h2>';
            html += '<p style="margin-bottom:10px; font-size:14px;">Estos son los datos ingresados:</p>';
            html += '<div class="dato-fila"><span>Nombre</span><span>' + document.getElementById('nombre').value + '</span></div>';
            html += '<div class="dato-fila"><span>Email</span><span>' + document.getElementById('email').value + '</span></div>';
            html += '<div class="dato-fila"><span>Edad</span><span>' + document.getElementById('edad').value + '</span></div>';
            html += '<div class="dato-fila"><span>Teléfono</span><span>' + document.getElementById('telefono').value + '</span></div>';
            html += '<div class="dato-fila"><span>Dirección</span><span>' + document.getElementById('direccion').value + '</span></div>';
            html += '<div class="dato-fila"><span>Ciudad</span><span>' + document.getElementById('ciudad').value + '</span></div>';
            html += '<div class="dato-fila"><span>Código postal</span><span>' + document.getElementById('cp').value + '</span></div>';
            html += '<div class="dato-fila"><span>DNI</span><span>' + document.getElementById('dni').value + '</span></div>';
            html += '<div class="dato-fila"><span>Contraseña</span><span>••••••••</span></div>';
            html += '<button onclick="cerrarModal()">Cerrar</button>';
            caja.innerHTML = html;
        } else {
            var html = '<h2 class="fallo">Hay errores en el formulario</h2>';
            html += '<ul class="lista-errores">';
            for (var i = 0; i < errores.length; i++) {
                html += '<li>' + errores[i] + '</li>';
            }
            html += '</ul>';
            html += '<button onclick="cerrarModal()">Entendido</button>';
            caja.innerHTML = html;
        }

        fondo.classList.add('abierto');
    }

    function cerrarModal() {
        document.getElementById('modalFondo').classList.remove('abierto');
    }

    document.getElementById('modalFondo').addEventListener('click', function(e) {
        if (e.target === this) {
            cerrarModal();
        }
    });

</script>
</body>
</html>
